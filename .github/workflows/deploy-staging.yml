name: Deploy StyrAI staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: styrai-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: styrai-staging
  LIGHTSAIL_SERVICE: styrai-staging

jobs:
  verify:
    name: Verify before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build deployable container
        run: docker build --tag styrai:${{ github.sha }} .

  deploy:
    name: Publish and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: styrai-github-staging

      - name: Sign in to the private image registry
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image_uri" .
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy the image to Lightsail
        id: deployment
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          STYRAI_AUTH_USERS_JSON: ${{ secrets.STYRAI_AUTH_USERS_JSON }}
          STYRAI_SESSION_SECRET: ${{ secrets.STYRAI_SESSION_SECRET }}
        run: |
          test -n "$STYRAI_AUTH_USERS_JSON"
          test -n "$STYRAI_SESSION_SECRET"
          jq -n \
            --arg image "$IMAGE_URI" \
            --arg auth "$STYRAI_AUTH_USERS_JSON" \
            --arg session_secret "$STYRAI_SESSION_SECRET" \
            '{
              containers: {
                styrai: {
                  image: $image,
                  environment: {
                    STYRAI_AUTH_USERS_JSON: $auth,
                    STYRAI_SESSION_SECRET: $session_secret,
                    STYRAI_DEPLOYMENT: "staging"
                  },
                  ports: {"8080": "HTTP"}
                }
              },
              publicEndpoint: {
                containerName: "styrai",
                containerPort: 8080,
                healthCheck: {
                  healthyThreshold: 2,
                  unhealthyThreshold: 2,
                  timeoutSeconds: 5,
                  intervalSeconds: 10,
                  path: "/api/health",
                  successCodes: "200"
                }
              }
            }' > "$RUNNER_TEMP/styrai-deployment.json"

          deployment_version=$(aws lightsail create-container-service-deployment \
            --region "$AWS_REGION" \
            --service-name "$LIGHTSAIL_SERVICE" \
            --cli-input-json "file://$RUNNER_TEMP/styrai-deployment.json" \
            --query 'containerService.nextDeployment.version' \
            --output text \
            --no-cli-pager)

          case "$deployment_version" in
            ''|*[!0-9]*)
              echo "Lightsail did not return the new deployment version." >&2
              exit 1
              ;;
          esac
          echo "version=$deployment_version" >> "$GITHUB_OUTPUT"

      - name: Wait for a healthy deployment
        id: service
        env:
          DEPLOYMENT_VERSION: ${{ steps.deployment.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            deployments=$(aws lightsail get-container-service-deployments \
              --region "$AWS_REGION" \
              --service-name "$LIGHTSAIL_SERVICE" \
              --output json \
              --no-cli-pager)
            state=$(jq -r \
              --argjson version "$DEPLOYMENT_VERSION" \
              '.deployments[] | select(.version == $version) | .state' \
              <<< "$deployments" | head -n 1)

            if [ "$state" = "ACTIVE" ]; then
              read -r current_version url < <(aws lightsail get-container-services \
                --region "$AWS_REGION" \
                --service-name "$LIGHTSAIL_SERVICE" \
                --query 'containerServices[0].[currentDeployment.version,url]' \
                --output text \
                --no-cli-pager)
              if [ "$current_version" != "$DEPLOYMENT_VERSION" ]; then
                echo "Deployment $DEPLOYMENT_VERSION is active but is not current." >&2
                exit 1
              fi
              curl --fail --silent --show-error --retry 8 --retry-all-errors \
                "$url/api/health" > /dev/null
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$state" = "FAILED" ]; then
              echo "Lightsail deployment $DEPLOYMENT_VERSION failed." >&2
              echo "$deployments" >&2
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for the Lightsail deployment." >&2
          exit 1

      - name: Publish deployment summary
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          {
            echo "## StyrAI staging deployed"
            echo
            echo "- URL: $SERVICE_URL"
            echo "- Revision: $GITHUB_SHA"
            echo "- Region: $AWS_REGION"
          } >> "$GITHUB_STEP_SUMMARY"
